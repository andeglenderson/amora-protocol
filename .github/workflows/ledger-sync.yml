name: GitOps Ledger Accountant

on:
  repository_dispatch:
    types: [ledger_entry, settlement_failure]

# Prevents overlapping runs from racing on the same file.
concurrency:
  group: ledger-mutations-${{ github.repository }}
  cancel-in-progress: false

# REQUIRED: default GITHUB_TOKEN is read-only on contents unless declared here.
# Without this, "git push origin main" below fails silently (403) and the
# workflow shows green right up until the push step, every single run.
permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ledger Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- BRANCH A: HANDLE SUCCESSFUL TRANSACTION ---
      - name: Process Micro-Payment Debit
        if: github.event.action == 'ledger_entry'
        run: |
          echo "Processing successful payment for asset: ${{ github.event.client_payload.assetRef }}"

          if [ ! -f data/balances.json ]; then
            mkdir -p data
            echo "{}" > data/balances.json
          fi

          TIER="${{ github.event.client_payload.tier }}"
          AMOUNT="${{ github.event.client_payload.settlement.amount || '2000' }}"

          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/balances.json', 'utf8'));
            const assetRef = '${{ github.event.client_payload.assetRef }}';

            if (!data[assetRef]) data[assetRef] = { hits: 0, total_spent_usdc: 0 };
            data[assetRef].hits += 1;
            data[assetRef].total_spent_usdc += (parseInt('$AMOUNT') / 1000000);
            data[assetRef].last_verified = new Date().toISOString();

            fs.writeFileSync('data/balances.json', JSON.stringify(data, null, 2));
          "

      # --- BRANCH B: HANDLE SETTLEMENT FAILURE ---
      - name: Log Defaulter to Audit Trail
        if: github.event.action == 'settlement_failure'
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ DISPUTE: Settlement Failure on Tier [${payload.tier}]`,
              body: `An AI Agent requested a provenance verification but the final settlement call failed.\n\n**Asset Hash/URL:** ${payload.assetRef}\n**Error Logged:** ${payload.error}`
            });

      # --- SAVE THE LEDGER UPDATES ---
      - name: Commit and Push Changes
        if: github.event.action == 'ledger_entry'
        run: |
          git config --global user.name "Ledger Accountant Bot"
          git config --global user.email "ledger-bot@yourdomain.dev"
          git add data/balances.json
          git diff-index --quiet HEAD || git commit -m "chore(ledger): reconcile transactions [skip ci]"
          git push origin main
